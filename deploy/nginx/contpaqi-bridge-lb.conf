# ============================================================
# Nginx load balancer para ContpaqiBridge pool (3 instancias)
# ============================================================
# Instalar en: /etc/nginx/sites-available/contpaqi-bridge-lb
# Activar:     ln -s /etc/nginx/sites-available/contpaqi-bridge-lb /etc/nginx/sites-enabled/
# Test:        nginx -t && systemctl reload nginx
# ============================================================

# Pool de instancias del bridge (corren en la PC Windows con ZeroTier)
upstream contpaqi_bridge_pool {
    # least_conn: envía la request al server con menos conexiones activas
    # (mejor para timbrado porque cada request toma ~5-10s)
    least_conn;

    # Las 3 instancias en ZeroTier IPs locales
    server 192.168.191.226:5000 max_fails=3 fail_timeout=30s;
    server 192.168.191.226:5001 max_fails=3 fail_timeout=30s;
    server 192.168.191.226:5002 max_fails=3 fail_timeout=30s;

    # Mantiene conexiones keepalive al pool (mejora performance)
    keepalive 32;
}

# Servidor que recibe las requests y las reparte al pool
server {
    listen 8080;
    listen [::]:8080;

    server_name _;

    # Logs
    access_log /var/log/nginx/contpaqi_bridge_access.log;
    error_log /var/log/nginx/contpaqi_bridge_error.log;

    # Timeouts generosos: el timbrado puede tardar 30s+ en responder
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Buffers grandes para respuestas XML/PDF
    proxy_buffer_size 16k;
    proxy_buffers 4 32k;
    proxy_busy_buffers_size 64k;

    # Pasar headers originales (incluido X-Api-Key)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Api-Key $http_x_api_key;

    # Health check endpoint (balanceador con nginx-plus)
    # location /health {
    #     health_check interval=5s fails=3 passes=2 uri=/api/Status/health;
    # }

    # Todo lo demás va al pool
    location / {
        proxy_pass http://contpaqi_bridge_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}