# ============================================================
# Nginx server block: bridge.asistenciavircom.com
# Proxy al ContpaqiBridge en la PC Windows (ZeroTier: 192.168.191.226:5000)
# ============================================================

server {
    server_name bridge.asistenciavircom.com;

    access_log /var/log/nginx/bridge_asistencia_access.log;
    error_log /var/log/nginx/bridge_asistencia_error.log;

    # Health check publico (no requiere API Key)
    location = /health {
        access_log off;
        proxy_pass http://192.168.191.226:5000/api/Status/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Webhook receiver (sin auth, valida HMAC en el body)
    location = /webhooks/contpaqi {
        access_log /var/log/nginx/bridge_asistencia_webhooks.log;
        proxy_pass http://192.168.191.226:5000/api/Webhooks;
        proxy_read_timeout 60s;
        proxy_connect_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Todo lo demas va al bridge con timeouts largos (timbrado puede tardar 30s+)
    location / {
        proxy_pass http://192.168.191.226:5000;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/bridge.asistenciavircom.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bridge.asistenciavircom.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name bridge.asistenciavircom.com;
    return 301 https://$host$request_uri;
}